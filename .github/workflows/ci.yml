name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate data.json
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          import update_data as u
          d = json.load(open('frontend/public/data.json'))
          bad = [s.get('id') for s in d['seizures'] if not u.is_valid(s)]
          assert d['seizures'], 'data.json has no seizures'
          assert not bad, f'invalid records: {bad[:10]}'
          for key in ('total_seizures', 'by_state', 'by_drug_type', 'by_month', 'top_locations'):
              assert key in d['stats'], f'stats.{key} missing'
          print(f"{len(d['seizures'])} seizures OK")
          PY
