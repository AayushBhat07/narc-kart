name: Weekly Drug Seizure Data Update

on:
  schedule:
    # Every Sunday at 6 PM IST = 12:30 UTC
    - cron: '30 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only: nothing to install. The script merges new
      # records into data.json and refuses to shrink it.
      - name: Fetch and merge new seizures
        run: python scripts/update_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- frontend/public/data.json; then
            echo "No new seizures this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data.json
          git commit -m "chore: update drug seizure data $(date -u +%F)"
          git push
