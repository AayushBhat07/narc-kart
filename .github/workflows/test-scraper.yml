name: Test Scraper (Manual)

on:
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/scraper/requirements.txt'

      - name: Install dependencies
        run: pip install -q -r backend/scraper/requirements.txt

      - name: Quick source health check
        run: |
          cd backend/scraper && python test_sources.py

      - name: Run scraper
        run: |
          python backend/scraper/run_scraper.py
        working-directory: /home/runner/work/narc-kart/narc-kart
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: changed
        run: |
          if git diff --stat | grep -q "frontend/public/data.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "shawn-bot"
          git config user.email "shawn@openclaw.ai"
          git add frontend/public/data.json
          git commit -m "chore: update drug seizure data $(date -I)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}