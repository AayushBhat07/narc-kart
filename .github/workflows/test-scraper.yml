name: Test Scraper (Manual)

on:
  workflow_dispatch:  # Manual trigger only from GitHub Actions tab

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/scraper/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -q -r backend/scraper/requirements.txt
          pip install -q python-dateutil

      - name: Quick source health check
        run: |
          cd backend/scraper && python test_sources.py

      - name: Run scraper
        run: |
          cd backend/scraper && python run_scraper.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: changed
        run: |
          if git diff --stat | grep -q "frontend/public/data.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Show data.json summary
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "=== data.json generated ==="
          python -c "
import json
with open('frontend/public/data.json') as f:
    d = json.load(f)
print(f\"Records: {d['meta']['total_records']}\")
print(f\"Generated: {d['meta']['generated_at']}\")
print(f\"Total seizures: {d['stats']['total_seizures']}\")
print(f\"This week: {d['stats']['raids_this_week']}\")
"