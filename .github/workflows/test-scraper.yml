name: Test Scraper (Manual)

on:
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/scraper/requirements.txt'

      - name: Install dependencies
        run: pip install -q -r backend/scraper/requirements.txt

      - name: Quick source health check
        run: |
          cd backend/scraper && python test_sources.py

      - name: Run scraper
        run: |
          cd backend/scraper && python run_scraper.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: changed
        run: |
          if git diff --stat | grep -q "frontend/public/data.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Show data.json summary
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "=== data.json generated ==="
          python -c "import json; d=json.load(open('frontend/public/data.json')); print('Records:', len(d.get('seizures', d.get('meta', {}).get('total_records', 'unknown'))), '/ Generated:', d.get('meta', {}).get('generated_at', 'N/A'))"